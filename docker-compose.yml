version: '3.8'

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html/static:ro # Твоя музыка/картинки
    depends_on:
      - frontend
      - backend
  db:
    image: postgres:bookworm
    command: [ "postgres", "-c", "wal_level=logical" ] # Это критично!
    ports: [ "5433:5432" ] # В деве открываем, чтобы зайти через DBeaver/Adminer
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      - MEILI_ENV=development

  backend:
    build:
      context: ./server
      target: development
    env_file:
      - ./server/.env
    environment:
      - CHOKIDAR_USEPOLLING=true # Обязательно для подхвата правок на Windows/WSL
      - WATCHPACK_POLLING=true    # На всякий случай для некоторых сборщиков
    volumes:
      - ./server:/app
      - ./static:/app/static
      - /app/node_modules
    ports: ["4000:4000"]
    depends_on: [db, meilisearch]

  frontend:
    build:
      context: ./client
      target: development
    env_file:
      - ./client/.env
    environment:
      - WATCHPACK_POLLING=true
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next  # ЭТО РЕШИТ ПРОБЛЕМУ КОНФЛИКТА КЭША
      - /app/.next-internal  # ИЗОЛИРУЕМ проблемную папку (добавь это!)
      - /app/.config
    ports: ["3000:3000"]

volumes:
  redis_data:
  postgres_data: