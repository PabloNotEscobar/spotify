version: '3.8'

services:
  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html/static:ro # Твоя музыка/картинки
    depends_on:
      - frontend
      - backend

  db:
    image: bfontaine/postgres-wal2json:15-bookworm
    container_name: db
    command: postgres -c wal_level=logical
    ports: [ "5433:5432" ]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}

