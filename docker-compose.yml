  backend:
    container_name: backend
    build:
      context: ./server
      target: development
    env_file:
      - ./server/.env
    environment:
      - CHOKIDAR_USEPOLLING=true # Важно для NestJS/Watch mode на Windows
      - WATCHPACK_POLLING=true
    volumes:
      - ./server:/app
      - ./static:/app/static
      - /app/node_modules
    ports: ["4000:4000"]
    depends_on: [db]

  frontend:
    container_name: frontend
    build:
      context: ./client
      target: development
    env_file:
      - ./client/.env
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      - WATCHPACK_POLLING=true
      - NEXT_TURBO_POLL=1000   # Экспериментальный флаг для некоторых версий 15.x/16.x
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next  # ЭТО РЕШИТ ПРОБЛЕМУ КОНФЛИКТА КЭША
      - ./static:/app/public/static:ro
    ports: ["3000:3000"]

volumes:
  redis_data:
  postgres_data:
  meilibridge-data: