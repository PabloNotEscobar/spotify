version: '3.8'

services:
  # 1. Nginx — теперь это отдельный сервис-"шлюз"
  gateway:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html/static:ro # Раздача музыки/фото
    depends_on:
      - frontend
      - backend

  # 2. Frontend — это Node.js сервер (Next.js)
  frontend:
    build: ./client # Тут Dockerfile с финальным FROM node (без Nginx внутри)
    expose:
      - "3000"
    depends_on:
      - backend

  # 3. Backend — твой NestJS
  backend:
    build:
      context: ./server
      target: production
    command: npm run start:prod
    expose:
      - "8080"
    depends_on:
      - db

  db:
    image: postgres:bookworm
    volumes: ["./postgres_data:/var/lib/postgresql"]
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}

  meilisearch:
    image: getmeili/meilisearch:latest
