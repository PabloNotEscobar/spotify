version: '3.8'

services:
  traefik:
    image: traefik:v3
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/certs
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=0kvestok0@gmail.com
      - --certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json

  gateway:
    image: nginx:stable-alpine
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`nowayshop.ru`) || Host(`flowmusic.ru`)
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.tls.certresolver=letsencrypt
      - traefik.http.services.app.loadbalancer.server.port=80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      - frontend
      - backend
    restart: on-failure

  frontend:
    build: ./client
    expose:
      - "3000"
    depends_on:
      - backend
    env_file:
      - ./client/.env
    volumes:
      - ./static:/app/public/static:ro

  backend:
    build:
      context: ./server
      target: production
    env_file:
      - ./server/.env
    volumes:
      - ./static:/app/static
    expose:
      - "8080"
    depends_on:
      - db

  db:
    image: bfontaine/postgres-wal2json:15-bookworm
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}

volumes:
  postgres_data_prod:
  traefik_certs: