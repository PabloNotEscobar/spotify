  version: '3.8'

  services:
    gateway:
      image: nginx:stable-alpine
      ports:
        - "80:80"
      volumes:
        - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
        - ./static:/usr/share/nginx/html/static:ro
      depends_on:
        - frontend
        - backend

    frontend:
      build: ./client
      expose:
        - "3000"
      depends_on:
        - backend
      env_file:
        - ./client/.env
      volumes:
        - ./static:/app/public/static:ro

    backend:
      build:
        context: ./server
        target: production
      env_file:
        - ./server/.env
      volumes:
        - ./static:/app/static
      expose:
        - "8080"
      depends_on:
        - db

    db:
      image: bfontaine/postgres-wal2json:15-bookworm
      volumes:
        - postgres_data_prod:/var/lib/postgresql/data
      ports:
        - "5434:5432"
      environment:
        - POSTGRES_USER=${DB_USER}
        - POSTGRES_PASSWORD=${DB_PASSWORD}
        - POSTGRES_DB=${DB_NAME}


  volumes:
    postgres_data_prod: